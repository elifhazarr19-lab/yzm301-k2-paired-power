[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pairedpower"
version = "0.1.0"
description = "Paired-samples t-test power and sample size calculator"
requires-python = ">=3.10"
dependencies = ["scipy>=1.11"]

[project.optional-dependencies]
dev = ["pytest>=8", "statsmodels>=0.14"]

[project.scripts]
gpower-clone = "pairedpower.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
